# ==============================================================================
# Test-specific overrides for @SpringBootTest Selenium tests
# Overrides main application.properties with an in-memory H2 database so that:
#   - the test database is isolated from the production file database
#   - no file-lock conflicts when both the app and tests use the same file
# server.port=0 is intentionally absent; @SpringBootTest(RANDOM_PORT) sets it.
# ==============================================================================

# In-memory H2 – separate named DB per test context to avoid schema conflicts
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Thymeleaf – disable cache so templates are always current
spring.thymeleaf.cache=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# H2 console (used in dev, keep enabled in tests too)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
