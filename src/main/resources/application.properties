# ==============================================================================
# Telecom Tower Maintenance Portal - Application Configuration
# ==============================================================================

spring.application.name=telecom-tower-maintenance-portal
# Standard application port (matches container EXPOSE 8080)
server.port=8080

# ------------------------------------------------------------------------------
# H2 Database Configuration (File-based persistence in ./data/telecomdb)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/telecomdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging, secured in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ------------------------------------------------------------------------------
# Production MySQL Switch (Uncomment and configure for MySQL deployment)
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/telecom_tower_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=telecom_user
# spring.datasource.password=telecom_pass
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ------------------------------------------------------------------------------
# Thymeleaf Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ------------------------------------------------------------------------------
# Spring Boot Actuator Monitoring
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
