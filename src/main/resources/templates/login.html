<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Telecom Tower Maintenance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

<div class="container px-3">
    <div class="card login-card mx-auto border-0 bg-white p-4" id="card-login">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                <i class="bi bi-broadcast-pin fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark" id="login-title">Tower Maintenance Portal</h3>
            <p class="text-muted small">Sign in with your role-based credentials</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small" id="alert-login-error">
            <i class="bi bi-exclamation-circle-fill me-1"></i>
            Invalid username or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small" id="alert-login-logout">
            <i class="bi bi-info-circle-fill me-1"></i>
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post" id="form-login">
            <div class="mb-3">
                <label for="input-username" class="form-label small fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="input-username" name="username" placeholder="e.g. tech1, sup1, admin" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="input-password" class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="input-password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2" id="btn-login-submit">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <span class="text-muted small d-block mb-2">Quick Demo Credentials:</span>
            <div class="d-flex justify-content-center gap-1 flex-wrap">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-fill-tech" onclick="fillCreds('tech1', 'tech123')">
                    Technician (tech1)
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-fill-sup" onclick="fillCreds('sup1', 'sup123')">
                    Supervisor (sup1)
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-fill-admin" onclick="fillCreds('admin', 'admin123')">
                    Admin (admin)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function fillCreds(u, p) {
        document.getElementById('input-username').value = u;
        document.getElementById('input-password').value = p;
    }
</script>

</body>
</html>
