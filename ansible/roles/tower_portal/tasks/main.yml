---
# roles/tower_portal/tasks/main.yml
# Idempotent provisioning: Docker + app user + dirs + env + container + health

# ── 1. Docker prerequisites ──────────────────────────────────────────────────
- name: Install apt prerequisites for Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Create /etc/apt/keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false          # idempotent – skip if already present

- name: Add Docker apt repository
  apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine and CLI
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: true

# ── 2. Application user ───────────────────────────────────────────────────────
- name: Create app group
  group:
    name: "{{ app_group }}"
    state: present

- name: Create app user (no login shell)
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Add deploying user (vedanti) to docker group
  user:
    name: vedanti
    groups: docker
    append: true

# ── 3. Directory structure ────────────────────────────────────────────────────
# Container appuser UID=999, host appuser UID may differ – use numeric UID
- name: Create application directory tree (owned by container UID 999)
  file:
    path: "{{ item }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0755"
  loop:
    - "{{ app_base_dir }}"
    - "{{ app_base_dir }}/config"
    - "{{ app_base_dir }}/data"
    - "{{ app_base_dir }}/logs"
    - "{{ app_base_dir }}/releases"

# ── 4. Environment file ───────────────────────────────────────────────────────
- name: Write environment file from template
  template:
    src: app.env.j2
    dest: "{{ app_base_dir }}/config/app.env"
    owner: "999"
    group: "999"
    mode: "0640"
  notify: restart tower-portal container

# ── 5. Pull latest image ──────────────────────────────────────────────────────
- name: Pull Docker image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    tag: "{{ docker_tag }}"
    source: pull
  register: pull_result

# ── 6. Deploy / update container ─────────────────────────────────────────────
- name: Deploy tower-portal container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ docker_image }}:{{ docker_tag }}"
    state: started
    restart_policy: "{{ docker_restart_policy }}"
    ports:
      - "{{ host_port }}:{{ container_port }}"
    env_file: "{{ app_base_dir }}/config/app.env"
    volumes:
      - "{{ app_base_dir }}/data:/app/data"
      - "{{ app_base_dir }}/logs:/app/logs"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  register: container_result

# ── 7. Record deployment in release history ───────────────────────────────────
- name: Append deployment to release history
  lineinfile:
    path: "{{ release_history_file }}"
    line: >-
      {{ ansible_date_time.iso8601 }}  image={{ docker_image }}:{{ docker_tag }}
      container={{ container_name }}  host_port={{ host_port }}
      changed={{ container_result.changed }}
    create: true
    owner: "999"
    group: "999"
    mode: "0644"

# ── 8. Health-check loop ──────────────────────────────────────────────────────
- name: Wait for application health endpoint to become OK
  uri:
    url: "{{ healthcheck_url }}"
    method: GET
    return_content: true
    status_code: 200
  register: health_resp
  until: >-
    health_resp.status == 200 and
    (health_resp.json.status | default('')) == 'UP'
  retries: "{{ healthcheck_retries }}"
  delay: "{{ healthcheck_delay }}"

- name: Show health response
  debug:
    msg: "✅ Health check passed: {{ health_resp.json }}"
